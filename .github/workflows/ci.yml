name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Prisma Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite
        run: npx prisma db seed

      - name: Run Backend Linter (Oxlint)
        working-directory: ./backend
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite
          JWT_SECRET: brewlite-test-jwt-secret-key-2026
        run: npm run test

      - name: Run E2E Integration Tests (Vitest)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite
          JWT_SECRET: brewlite-test-jwt-secret-key-2026
        run: npm run test:e2e

      - name: Build Backend (NestJS)
        working-directory: ./backend
        run: npm run build

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Linter (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend (Next.js)
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
        run: npm run build || npm run build

  docker-check:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Docker Compose Services
        run: docker compose build

